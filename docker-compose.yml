# Local development database. Not used in production.
# One Postgres instance hosts separate databases: `rotiqa` (app), `rotiqa_demo` (live demo), `rotiqa_test` (tests).
services:
  postgres:
    image: postgres:18-alpine
    container_name: rotiqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rotiqa
      POSTGRES_PASSWORD: rotiqa
      POSTGRES_DB: rotiqa
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - rotiqa-pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotiqa -d rotiqa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rotiqa-pgdata:
